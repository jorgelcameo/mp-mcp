[project]
name = "mp-mcp"
version = "0.1.0"
description = "Remote MCP server (Streamable HTTP) on AWS Lambda"
readme = "README.md"
authors = [
    { name = "Jorge Luis", email = "jorge.cameo@assuresoft.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "mcp>=2,<3",
    "uvicorn>=0.54.0",
]

[project.scripts]
mp-mcp = "mp_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
