AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  mp-mcp — remote MCP server (Streamable HTTP, stateless) on AWS Lambda, with a
  separate API Gateway JSON facade and quota proxy for the website. Secrets stay
  in SSM Parameter Store.

Parameters:
  AuthTokenParam:
    Type: String
    Default: /mcp-server/auth-token
    Description: SSM SecureString parameter holding the bearer token.

  AnthropicKeyParam:
    Type: String
    Default: /mcp-server/anthropic-api-key
    Description: SSM SecureString parameter holding the Anthropic API key.

  AllowedHosts:
    Type: String
    Default: '*'
    Description: >
      Comma-separated Host header allowlist. '*' disables DNS-rebinding protection
      because the Function URL hostname only exists after the first deploy. To
      harden, redeploy with the real host from the McpFunctionUrl output.

  LogRetentionDays:
    Type: Number
    Default: 14
    MinValue: 1

  BudgetMonthlyLimitUsd:
    Type: Number
    Default: 5
    Description: Monthly cost budget for the cost alert (CR2).

  BudgetNotificationEmail:
    Type: String
    Default: ''
    Description: Email for the budget alert. Leave empty to skip creating the budget.

  FrontendOrigin:
    Type: String
    Default: https://jorgelcameo.github.io
    Description: Exact HTTPS origin allowed to call the public quote API.

  MaxpaynizeLimit:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Maxpaynize requests allowed per source IP in each quota window.

  MaxpaynizeWindowSeconds:
    Type: Number
    Default: 86400
    MinValue: 1
    Description: Quota window in seconds; lower this value for testing.

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetNotificationEmail, '']]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  McpFunction:
    Type: AWS::Serverless::Function
    # Wait for the log group so CloudWatch cannot auto-create it first with
    # retention "never expire" and then collide with this resource.
    DependsOn: McpLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-mcp
      PackageType: Image
      Architectures:
        - arm64
      Environment:
        Variables:
          SSM_AUTH_TOKEN_PARAM: !Ref AuthTokenParam
          SSM_ANTHROPIC_KEY_PARAM: !Ref AnthropicKeyParam
          ALLOWED_HOSTS: !Ref AllowedHosts
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Sid: ReadOnlyTheTwoSecrets
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AuthTokenParam}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicKeyParam}
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: v1

  McpFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt McpFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      # No Cors block on purpose: the ASGI app owns CORS (Starlette middleware),
      # and Function URL CORS cannot express the Mcp-* headers cleanly.

  McpFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    # Must be applied after the URL exists, or Lambda's edge ignores it and every
    # request gets a 403 "Forbidden" from the Function URL itself.
    DependsOn: McpFunctionUrl
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !GetAtt McpFunction.Arn
      Principal: '*'
      FunctionUrlAuthType: NONE

  McpFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    DependsOn: McpFunctionUrl
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt McpFunction.Arn
      Principal: '*'
      InvokedViaFunctionUrl: true

  QuoteHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - content-type
        MaxAge: 600
      RouteSettings:
        'POST /quote':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        'GET /quota':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Max Payne quote API
          version: '1.0'
        paths:
          /quote:
            post:
              responses:
                '200':
                  description: Quote match or quota error
          /quota:
            get:
              responses:
                '200':
                  description: Remaining quote requests

  QuoteUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_key
          AttributeType: S
        - AttributeName: window_id
          AttributeType: N
      KeySchema:
        - AttributeName: client_key
          KeyType: HASH
        - AttributeName: window_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  QuoteApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-quote-api
      CodeUri: quote-api/
      Handler: app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 28
      Environment:
        Variables:
          MCP_ENDPOINT: !Join ['', [!GetAtt McpFunctionUrl.FunctionUrl, mcp]]
          SSM_AUTH_TOKEN_PARAM: !Ref AuthTokenParam
          QUOTA_TABLE_NAME: !Ref QuoteUsageTable
          QUOTA_LIMIT: !Ref MaxpaynizeLimit
          QUOTA_WINDOW_SECONDS: !Ref MaxpaynizeWindowSeconds
      Policies:
        - Statement:
            - Sid: ReadMcpBearerToken
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AuthTokenParam}
            - Sid: EnforceQuoteQuota
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt QuoteUsageTable.Arn
      Events:
        FindQuote:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuoteHttpApi
            Path: /quote
            Method: POST
            TimeoutInMillis: 29000
        GetQuota:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuoteHttpApi
            Path: /quota
            Method: GET
            TimeoutInMillis: 29000

  McpLogGroup:
    Type: AWS::Logs::LogGroup
    # Created explicitly so retention is enforced (CR3); SAM's implicit log group
    # would never expire.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # Must match the function name Lambda uses for its log group; kept as its
      # own !Sub so this resource does not depend on the function (which in turn
      # depends on this one).
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-mcp
      RetentionInDays: !Ref LogRetentionDays

  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetMonthlyLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              # The whole Budget resource is gated by HasBudgetEmail, so this ref
              # is only evaluated when the parameter is non-empty.
              Address: !Ref BudgetNotificationEmail

Outputs:
  QuoteApiBaseUrl:
    Description: JSON API base URL for the website
    Value: !GetAtt QuoteHttpApi.ApiEndpoint

  McpEndpoint:
    Description: MCP endpoint URL to give clients
    Value: !Sub ${McpFunctionUrl.FunctionUrl}mcp

  McpFunctionUrlHost:
    Description: Function URL host (use as AllowedHosts to enable DNS-rebinding protection)
    Value: !Select [2, !Split ['/', !GetAtt McpFunctionUrl.FunctionUrl]]

  McpFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt McpFunction.Arn

  LogGroupName:
    Description: CloudWatch log group (retention applies)
    Value: !Sub /aws/lambda/${AWS::StackName}-mcp
